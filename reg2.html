<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reg2</title>
    <link rel="stylesheet" href="reg2.css">
</head>
<body>
    <div class="container">
    <div class="h2">
        <h2>IconTech Academy Registration</h2>
    <p>Fill the form below to join our tech programs:</p>
    </div>
    <div class="form">
    <form>
        <label for="fname">Full Name*</label>
        <input type="text" id="name" placeholder="FULL NAME"    required>
        <label for="Email">Email*</label>
        <input type="email" name="" id=""  placeholder="EMAIL"  required>
        <label for="number">Phone Number*</label>
        <input type="tel" name="" id=""  placeholder="08080000000"  required>
        <label for="date">Date of Birth*</label>
        <input type="date" name="" id=""  placeholder="mm/dd/yyyy"  required>
        <label for="address">Residential Address*</label>
        <input type="text" name="" id="" placeholder="HOME ADDRESS" required>
        <label for="state">State of Origin*</label>
        <input type="state" placeholder="STATE OF ORIGIN"   required>
        <label for="town">Home Town*</label>
        <input type="text"required>
        <label for="natoinality">Nation/Country*</label>
        <input type="text" name="country"   required>
        <div class="select">
        <label>Choose Tech Track:</label>
        <select>
            <option disabled selected>--Choose Tech Track</option>
            <option value="Full stack">Full Stack Web Development</option>
            <option value="frontend">Frontend Development</option>
            <option value="backend">Backend Development</option>
            <option>Data Analysis</option>
            <option value="UI/UX">UI/UX</option>
            <option value="cs">Cyber Security</option>
        </select>
        </div>

        <p>--Choose your gender</p>
        <div class="radio">
        <div class="radio-group">
            <label for="male">Male</label>
            <input type="radio" name="gender" id="male">
        </div>
        <div class="radio-group">
            <label for="female">Female</label>
            <input type="radio" name="gender" id="female">
        </div>
        </div>
<div class="form2">
        <h2>
            --for parents/guidance only
        </h2>
        <label for="name">Name*</label>
        <input type="text" name="name" id="" required>
         <label for="number">Phone Number*</label>
        <input type="tel" name="" id=""  placeholder="08080000000"   required>
        <label for="address">Residential Address*</label>
        <input type="text" name="" id="" placeholder="HOME ADDRESS" required>
        <label for="state">State of Origin*</label>
        <input type="state" placeholder="STATE OF ORIGIN" required>
        <label for="town">Home Town*</label>
        <input type="text" name="" id="" required>
        <label for="natoinality">Nation/Country*</label>
        <input type="text" name="country" id="" required>
</div>

<div class="text-area">
    <p>Your aims and objective for learning tech:</p>
    <textarea name="" id="" cols="30" rows="10"></textarea>
</div>
    <button><a href="last.html">Submit</a></button>
    </form>
    </div>
    </div>
</body>
</html>
